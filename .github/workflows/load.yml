name: Load sources

# Fetches and loads every source that has a loader, inside the Docker image, one step per
# source so each step's time and outcome show up separately. Row counts are reported as
# annotations. Runs when loading code changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "semalingo/loaders/**"
      - "semalingo/cldf.py"
      - "semalingo/fetch.py"
      - "semalingo/writer.py"
      - "semalingo/matching.py"
      - "semalingo/wikitext.py"
      - "scripts/report_lists.py"
      - "semalingo/schema/**"
      - "Dockerfile"
      - ".github/workflows/load.yml"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          docker build -t semalingo:load .
          mkdir -p data
          echo "RUN=docker run --rm --user $(id -u):$(id -g) -v $PWD/data:/app/data semalingo:load" >> "$GITHUB_ENV"
          echo "LISTS=basic-english wiktionary-1000-basic basic-english-combined voa-special-english simple-misspellings nsm-primes" >> "$GITHUB_ENV"

      - name: Fetch glottolog
        timeout-minutes: 10
        run: $RUN fetch glottolog
      - name: Load glottolog
        timeout-minutes: 15
        run: $RUN load glottolog

      - name: Fetch datsemshift
        timeout-minutes: 10
        run: $RUN fetch datsemshift
      - name: Load datsemshift
        timeout-minutes: 15
        run: $RUN load datsemshift

      - name: Fetch clics
        timeout-minutes: 10
        run: $RUN fetch clics
      - name: Load clics
        timeout-minutes: 15
        run: $RUN load clics

      - name: Fetch wold
        timeout-minutes: 10
        run: $RUN fetch wold
      - name: Load wold
        timeout-minutes: 15
        run: $RUN load wold

      - name: Fetch concepticon
        timeout-minutes: 10
        run: $RUN fetch concepticon
      - name: Load concepticon
        timeout-minutes: 15
        run: $RUN load concepticon

      - name: Fetch oewn
        timeout-minutes: 10
        run: $RUN fetch oewn
      - name: Load oewn
        timeout-minutes: 15
        run: $RUN load oewn

      - name: Fetch norare
        timeout-minutes: 10
        run: $RUN fetch norare
      - name: Load norare
        timeout-minutes: 15
        run: $RUN load norare

      - name: Fetch concepticon-maps
        timeout-minutes: 10
        run: $RUN fetch concepticon-maps
      - name: Load concepticon-maps
        timeout-minutes: 15
        run: $RUN load concepticon-maps

      - name: Fetch and load the word lists
        timeout-minutes: 10
        run: $RUN build $LISTS

      - name: Match words to Concepticon by gloss
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          $RUN match oewn $LISTS | tee match.txt
          grep -v -e '\.\.\.$' -e ' done in ' match.txt | sed 's/^/::notice title=match::/'

      - name: Word-list report
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --user $(id -u):$(id -g) -v $PWD/data:/app/data -v $PWD/scripts:/app/scripts \
            --entrypoint python semalingo:load scripts/report_lists.py $LISTS | tee lists.txt
          sed 's/^/::notice title=lists::/' lists.txt

      - name: Report
        if: always()
        shell: bash
        run: |
          $RUN stats | tee stats.txt || true
          while IFS= read -r line; do echo "::notice title=stats::$line"; done < stats.txt
          du -sh data/raw/* data/semalingo.duckdb 2>/dev/null | sed 's/^/::notice title=size::/' || true
