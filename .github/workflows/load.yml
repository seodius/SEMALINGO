name: Load sources

# Fetches and loads every source that has a loader, inside the Docker image, and reports
# row counts as annotations. Runs when loading code changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "semalingo/loaders/**"
      - "semalingo/cldf.py"
      - "semalingo/fetch.py"
      - "semalingo/writer.py"
      - "semalingo/schema/**"
      - "Dockerfile"
      - ".github/workflows/load.yml"

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t semalingo:load .
      - name: Fetch and load
        shell: bash
        run: |
          mkdir -p data
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data:/app/data" semalingo:load build 2>&1 | tee build.log
      - name: Report
        if: always()
        shell: bash
        run: |
          grep -E "semalingo:|Error|Traceback" build.log | head -20 | sed 's/^/::error title=build::/' || true
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data:/app/data" semalingo:load stats | tee stats.txt || true
          while IFS= read -r line; do echo "::notice title=stats::$line"; done < stats.txt
          du -sh data/raw/* data/semalingo.duckdb 2>/dev/null | sed 's/^/::notice title=size::/' || true
