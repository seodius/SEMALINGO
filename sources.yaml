# SEMALINGO source registry: one entry per dataset.
#
# This file is the source of truth for what SEMALINGO loads and under which terms.
# DATA-LICENSES.md is generated from it (`semalingo licences --write`).
#
# Fields
#   id               slug, also the prefix of every node id from this source ("<id>:<local id>")
#   name             human-readable name
#   wave             first | second | parked
#   unit             what one row is: forms | lemmas | concepts | meanings | senses | classes |
#                    primes | properties | associations | aggregates | other
#   homepage         where the source is described
#   download         where the raw data comes from
#   format           raw format
#   version          pinned version; for sources without releases, the commit or checksum
#                    is recorded at download time
#   licence          licence of the raw data, or TODO
#   redistributable  yes | no | TODO  (may the raw data be redistributed, under its licence?)
#   used_by          exit questions this source serves: Q1, Q3a, Q3b, Q4, Q5
#   checked          true once every field above has been verified on the source's own pages
#   notes            free text
#
# Verification pass of 2026-10-10: an entry is `checked: true` only when every field was
# confirmed on the source's own pages; anything that could not be confirmed stays TODO and
# the notes say why. Raw data is never committed to this repository.

sources:

