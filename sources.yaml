    homepage: https://norare.clld.org
    download: https://github.com/concepticon/norare-data
    format: TSV with CSVW metadata (norare.tsv, datasets.tsv, one TSV per dataset)
    version: "no release listed: pin the commit at download"
    licence: "CC BY-NC 4.0 per the norare-data LICENSE file; the norare.clld.org footer says CC BY 4.0"
    redistributable: TODO
    used_by: [Q1]
    checked: false
    notes: >-
      Norms already mapped to Concepticon concept sets, including Kuperman-2012-AoA and
      Brysbaert-2014-Concreteness. Open: the repository (non-commercial) and the web app
      (CC BY) state different licences; ask the maintainers which applies to the data.

