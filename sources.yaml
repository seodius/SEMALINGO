    version: "Open Lexicon copy, md5 ee7be8db21f26e1925ac0ea3ab598f32 (descriptor of 2019-04-30)"
    licence: "CC BY-SA, as stated in Open Lexicon's SUBTLEX-US readme"
    redistributable: "yes"
    used_by: [Q1]
    checked: false
    notes: >-
      Subtitle word frequencies, American English: frequency per million words and the
      percentage of films a word occurs in. Taken from Open Lexicon (co-maintained by Boris
      New, one of the two SUBTLEX-US authors), which states CC BY-SA; the UGent page, which
