# SEMALINGO source registry: one entry per dataset.
#
# This file is the source of truth for what SEMALINGO loads and under which terms.
# DATA-LICENSES.md is generated from it (`semalingo licences --write`).
#
# Fields
#   id               slug, also the prefix of every node id from this source ("<id>:<local id>")
#   name             human-readable name
#   wave             first | second | parked
#   unit             what one row is: forms | lemmas | concepts | meanings | senses | classes |
#                    primes | properties | associations | aggregates | other
#   homepage         where the source is described
#   download         where the raw data comes from
#   format           raw format
#   version          pinned version; for sources without releases, the commit or checksum
#                    is recorded at download time
#   licence          licence of the raw data, or TODO
#   redistributable  yes | no | TODO  (may the raw data be redistributed, under its licence?)
#   used_by          exit questions this source serves: Q1, Q3a, Q3b, Q4, Q5
#   checked          true once every field above has been verified on the source's own pages
#   notes            free text
#
# Verification pass of 2026-10-10: an entry is `checked: true` only when every field was
# confirmed on the source's own pages; anything that could not be confirmed stays TODO and
# the notes say why. Raw data is never committed to this repository.

sources:

  # ---------- first wave ----------

  - id: concepticon
    name: Concepticon
    wave: first
    unit: concepts
    homepage: https://concepticon.clld.org
    download: https://github.com/concepticon/concepticon-cldf/releases/tag/v3.4.2
    format: CLDF Wordlist
    version: "v3.4.2 (2026-07-15; Concepticon 3.4.0 as CLDF)"
    licence: CC BY 4.0
    redistributable: "yes"
    used_by: [Q1, Q3a, Q4, Q5]
    checked: true
    notes: >-
      Pivot for the concept side; Wordbank uni-lemmas and other lists map onto it. Already
      contains Goddard-2011-63 (concept list from the 2011 NSM primes chart) and
      Ogden-1930-200 (the 200 picturable words of Basic English), both mapped to concept sets.

  - id: concepticon-maps
    name: Concepticon gloss lookup tables
    wave: first
    unit: other
    homepage: https://concepticon.clld.org
    download: https://github.com/concepticon/concepticon-data/tree/v3.4.0/mappings
    format: TSV, one file per language (map-<ISO 639-1>.tsv; ID, GLOSS, PRIORITY)
    version: "v3.4.0 (git tag in concepticon/concepticon-data, the release behind concepticon-cldf v3.4.x)"
    licence: "CC BY 4.0 (.zenodo.json and metadata.json of concepticon-data)"
    redistributable: "yes"
    used_by: [Q1, Q4, Q5]
    checked: true
    notes: >-
      Generated by Concepticon from all its concept lists: per language (41), every gloss a
      list uses for a concept set, with PRIORITY = how many list items use that link. English
      also gets "the eye(s)" and "to see" forms. SEMALINGO uses it as the index for gloss
      matching (semalingo match), the first mapping pass of step 4.
  - id: norare
    name: NoRaRe (Norms, Ratings and Relations)
    wave: first
    unit: properties
    homepage: https://norare.clld.org
    download: https://github.com/concepticon/norare-cldf
    format: CLDF Wordlist (norare-cldf; norare.csv zipped)
    version: "v1.1 (norare-cldf release of 2025-02-25)"
    licence: "CC BY 4.0 (norare-cldf LICENSE file and CLDF metadata); the curation repository norare-data is CC BY-NC 4.0"
    redistributable: "yes"
    used_by: [Q1]
    checked: true
    notes: >-
      126 studies, 863 variables, 142,527 word entries in 39 languages, 677,593 values, all
      mapped to Concepticon concept sets (Kuperman-2012-AoA, Brysbaert-2014-Concreteness,
      Lynott-2020-Sensorimotor, Scott-2019-Ratings and more). The web app and the CLDF
      release are CC BY 4.0; only the curation repository norare-data is CC BY-NC 4.0, so the
      loader uses the CLDF release. The values come from the original studies; cite them
      (datasets.csv, Citation). norare-data main already holds about 55 studies not in v1.1
      (e.g. Brysbaert-2025-Familiarity, Green-2025 AoA, Dulay-2026 AoA,
      Mochizuki-2026-Sensorimotor) and renames many existing ones; they arrive with the next
      release.
